/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  font-family: monospace;
  user-select: text;
  white-space: pre;
}

.xterm .xterm-accessibility-tree > div {
  transform-origin: left;
  width: fit-content;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
}

.xterm-decoration-top {
    z-index: 2;
    position: relative;
}



/* Derived from vs/base/browser/ui/scrollbar/media/scrollbar.css */

/* xterm.js customization: Override xterm's cursor style */
.xterm .xterm-scrollable-element > .scrollbar {
    cursor: default;
}

/* Arrows */
.xterm .xterm-scrollable-element > .scrollbar > .scra {
	cursor: pointer;
	font-size: 11px !important;
}

.xterm .xterm-scrollable-element > .visible {
	opacity: 1;

	/* Background rule added for IE9 - to allow clicks on dom node */
	background:rgba(0,0,0,0);

	transition: opacity 100ms linear;
	/* In front of peek view */
	z-index: 11;
}
.xterm .xterm-scrollable-element > .invisible {
	opacity: 0;
	pointer-events: none;
}
.xterm .xterm-scrollable-element > .invisible.fade {
	transition: opacity 800ms linear;
}

/* Scrollable Content Inset Shadow */
.xterm .xterm-scrollable-element > .shadow {
	position: absolute;
	display: none;
}
.xterm .xterm-scrollable-element > .shadow.top {
	display: block;
	top: 0;
	left: 3px;
	height: 3px;
	width: 100%;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 0 6px 6px -6px inset;
}
.xterm .xterm-scrollable-element > .shadow.left {
	display: block;
	top: 3px;
	left: 0;
	height: 100%;
	width: 3px;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}
.xterm .xterm-scrollable-element > .shadow.top-left-corner {
	display: block;
	top: 0;
	left: 0;
	height: 3px;
	width: 3px;
}
.xterm .xterm-scrollable-element > .shadow.top.left {
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}

<header><strong>Eya</strong><span id="status" role="status">Disconnected</span><span id="latency"></span><button id="connect" class="primary">Connect</button><button id="disconnect">Disconnect</button><button id="settings">Settings</button></header>
<div id="error" role="alert" hidden></div>
<main><div id="terminal" aria-label="Terminal; long press and drag to select text"></div></main>
<nav id="keybar" aria-label="Mobile terminal keys">
  <button type="button" data-key="escape" aria-label="Escape">Esc</button>
  <button type="button" data-key="tab">Tab</button>
  <button type="button" data-key="ctrl" id="ctrl-key" aria-pressed="false">Ctrl</button>
  <button type="button" data-key="paste">Paste</button>
  <div id="arrow-pad" role="button" tabindex="0" aria-label="Arrow key pad; drag and hold in a direction to repeat" data-direction=""><span class="pad-arrow pad-up">▲</span><span class="pad-arrow pad-down">▼</span><span class="pad-arrow pad-left">◀</span><span class="pad-arrow pad-right">▶</span><span id="arrow-stick"></span></div>
</nav>
<div id="terminal-menu" role="menu" hidden><button id="copy-selection" type="button">Copy</button><button id="paste-selection" type="button">Paste</button><button id="select-all" type="button">Select all</button><button id="clear-selection" type="button">Clear</button></div>
<dialog id="connect-dialog"><h2>Connect</h2><label>WebSocket URL<input id="url" type="url" placeholder="ws://server:8080/ws" autocomplete="url"></label><label>Shared password<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Any text"></label><label>Command to run after connecting<textarea id="default-command" maxlength="8192" spellcheck="false" placeholder="Optional, for example: tmux new -A -s main"></textarea><small>Runs once after each successful connection. This is stored in the generated client, so do not put secrets here.</small></label><p id="dialog-error" role="alert"></p><div class="actions"><button id="close-connect">Close</button><button id="start-connection" class="primary">Connect</button></div></dialog>
<dialog id="settings-dialog"><h2>Terminal settings</h2><div class="grid"><label>Font size<input id="font-size" type="number" min="8" max="36"></label><label>Scrollback lines<input id="scrollback" type="number" min="0" max="50000" step="100"></label></div><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><div class="grid"><label>Cursor style<select id="cursor-style"><option value="block">Block</option><option value="underline">Underline</option><option value="bar">Bar</option></select></label><label><input id="cursor-blink" type="checkbox"> Blinking cursor</label></div><label><input id="scroll-on-input" type="checkbox"> Return to the bottom when typing</label><label><input id="local-echo" type="checkbox"> Adaptive local echo<small>On slow links, safely predictable printable keys appear in the terminal after a short, latency-based delay. Disable it before password prompts or in programs that manage their own input.</small></label><p id="settings-error" role="alert" hidden></p><div class="actions"><button id="close-settings">Close</button></div><footer>Changes apply and save immediately.</footer></dialog>
