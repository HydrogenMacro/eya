<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eya · Generate client</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#0e151b;color:#e7f0f2}body{max-width:760px;margin:0 auto;padding:36px 20px 70px}h1{margin:0 0 4px;font-size:2rem}p{line-height:1.5;color:#b4c5ce}form{background:#18252f;border:1px solid #304653;border-radius:12px;padding:24px}label{display:block;font-weight:600;margin:20px 0 0}input,select,textarea,button{font:inherit}input:not([type=checkbox]),select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:11px;border:1px solid #526b79;border-radius:6px;background:#101b23;color:#fff}textarea{min-height:82px;resize:vertical}input[type=file]{padding:9px}small{display:block;color:#adc1ca;font-weight:400;line-height:1.4;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:550px){.grid{grid-template-columns:1fr}}button{background:#7fdbc5;color:#10241f;border:0;border-radius:6px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:24px}#error{color:#ffb4a9;white-space:pre-wrap}.warning{border-left:3px solid #e8bf6a;padding-left:12px}a{color:#89dfcc}
</style></head><body><h1>Eya</h1><p>Create a standalone terminal client for this server.</p><form id="form"><label>Server URL<input id="server" required placeholder="https://server.example.com or ws://server:8080"><small>The WebSocket endpoint is added automatically. A reverse-proxy path can be included.</small></label><label>Shared password<input id="key" type="password" autocomplete="off" spellcheck="false" required><small>Use the same non-empty EYA_KEY value as the server.</small></label><label>Default command after connecting<textarea id="command" maxlength="8192" spellcheck="false" placeholder="Optional, for example: tmux new -A -s main"></textarea><small>Runs once per successful connection. It is embedded in the downloaded file; do not place secrets here.</small></label><label>Custom terminal font <input id="font" type="file" accept=".woff,.woff2,.ttf,.otf,font/*"><small>Optional. A monospaced WOFF2, WOFF, TTF or OTF file (up to 4 MiB) is embedded into the client.</small></label><div class="grid"><label>Font size <input id="size" type="number" min="8" max="36" value="15"></label><label>Scrollback lines <input id="scrollback" type="number" min="0" max="50000" step="100" value="5000"></label></div><div class="grid"><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><label>Cursor style<select id="cursor-style"><option value="block">Block</option><option value="underline">Underline</option><option value="bar">Bar</option></select></label></div><label>Output format<select id="format"><option value="html">Standalone HTML</option><option value="svg">Interactive standalone SVG</option></select><small>SVG embeds the complete client in a responsive SVG document. Open it directly in a browser; SVG files embedded as images cannot run interactive scripts.</small></label><label><input id="cursor-blink" type="checkbox" checked> Blinking cursor</label><label><input id="scroll-on-input" type="checkbox" checked> Return to the bottom when typing</label><label><input id="local-echo" type="checkbox"> Enable adaptive local echo<small>On slow links, printable keystrokes can appear before the server replies. Leave this off for password prompts or applications with custom input.</small></label><p class="warning">The downloaded HTML or SVG contains your shared password and default command. Anyone who obtains it can access your terminal. Keep the file private and generate it over HTTPS or on a trusted network.</p><p id="error" role="alert"></p><button type="submit">Generate client</button></form><script>
const el=id=>document.getElementById(id);
el('server').value=location.origin;
function endpoint(value){let u=new URL(value.includes('://')?value:'https://'+value);if(!['http:','https:','ws:','wss:'].includes(u.protocol)||u.username||u.password||u.search||u.hash)throw Error('Enter an HTTP(S) or WS(S) server URL without credentials, query or fragment.');u.protocol=({ 'http:':'ws:', 'https:':'wss:' })[u.protocol]||u.protocol;const path=u.pathname.replace(/\/+$/,'');u.pathname=path.endsWith('/ws')?path:path+'/ws';return u.href;}
async function fontData(file){if(!file)return '';if(file.size>4*1024*1024)throw Error('Font must be 4 MiB or smaller.');if(!/\.(woff2?|ttf|otf)$/i.test(file.name))throw Error('Choose a WOFF2, WOFF, TTF or OTF font.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read the font.'));r.readAsDataURL(file);});}
function base64Utf8(value){const bytes=new TextEncoder().encode(value);let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(binary);}
function svgClient(html){const xhtml='http://www.w3.org/1999/xhtml',svgNs='http://www.w3.org/2000/svg',xlink='http://www.w3.org/1999/xlink';const source=new DOMParser().parseFromString(html,'text/html');const prelude='Object.defineProperties(document,{queryCommandSupported:{configurable:true,value:function(){return false}},createElement:{configurable:true,value:function(name,options){return document.createElementNS("http://www.w3.org/1999/xhtml",name,options)}}});';const programs=[prelude,...[...source.scripts].filter(script=>!script.type||/^(application|text)\/(java|ecma)script$/i.test(script.type)).map(script=>script.textContent)];for(const script of [...source.scripts])if(!script.type||/^(application|text)\/(java|ecma)script$/i.test(script.type))script.remove();const output=document.implementation.createDocument(svgNs,'svg');const root=output.documentElement;root.setAttribute('width','100%');root.setAttribute('height','100%');const title=output.createElementNS(svgNs,'title');title.textContent='Eya terminal';root.append(title);const foreignObject=output.createElementNS(svgNs,'foreignObject');for(const [name,value] of Object.entries({x:'0',y:'0',width:'100%',height:'100%'}))foreignObject.setAttribute(name,value);const client=output.importNode(source.documentElement,true);client.setAttribute('xmlns',xhtml);client.style.width='100%';client.style.height='100%';foreignObject.append(client);root.append(foreignObject);for(const program of programs){const script=output.createElementNS(svgNs,'script'),url='data:application/javascript;base64,'+base64Utf8(program);script.setAttribute('href',url);script.setAttributeNS(xlink,'xlink:href',url);root.append(script);}return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(output);}
el('form').onsubmit=async e=>{e.preventDefault();el('error').textContent='';try{const key=el('key').value,defaultCommand=el('command').value;const size=Number(el('size').value),scrollback=Number(el('scrollback').value);if(!Number.isInteger(size)||size<8||size>36||!Number.isInteger(scrollback)||scrollback<0||scrollback>50000)throw Error('Choose a valid font size and scrollback limit.');if(defaultCommand.length>8192||defaultCommand.includes('\0'))throw Error('Default command must be at most 8192 characters and cannot contain a NUL byte.');const config={url:endpoint(el('server').value.trim()),key,defaultCommand,font:await fontData(el('font').files[0]),fontSize:size,scrollback,theme:el('theme').value,cursorBlink:el('cursor-blink').checked,cursorStyle:el('cursor-style').value,localEcho:el('local-echo').checked,scrollOnUserInput:el('scroll-on-input').checked};const response=await fetch(new URL('client.html',location.href),{cache:'no-store'});if(!response.ok)throw Error('Could not download the client template.');let html=await response.text();const marker='<script id="eya-config" type="application/json">{}</'+'script>';if(!html.includes(marker))throw Error('The client template is incompatible with this generator.');html=html.replace(marker,()=>'<script id="eya-config" type="application/json">'+JSON.stringify(config).replace(/</g,'\\u003c')+'</'+'script>');const format=el('format').value;const content=format==='svg'?svgClient(html):html;const mime=format==='svg'?'image/svg+xml':'text/html';const a=document.createElement('a');const objectUrl=URL.createObjectURL(new Blob([content],{type:mime}));a.href=objectUrl;a.download=`eya-client.${format}`;a.click();setTimeout(()=>URL.revokeObjectURL(objectUrl),10000);}catch(err){el('error').textContent=err.message||'Could not generate the client.';}};
</script></body></html>
