<header><strong>Eya</strong><span>Client generator</span><small id="generator-version" class="generator-version" aria-label="Version"></small><nav class="launchers" aria-label="Hosted clients"><a href="client.html">Open HTML</a><a href="client.svg">Open SVG</a></nav></header>
<h1>Create client</h1>
<form id="form" class="generator-shell" novalidate>
<div class="generator-layout"><nav id="generator-nav" class="generator-nav" aria-label="Configuration"></nav><main class="generator-content"><label class="generator-search-label" for="generator-search">Search settings</label><input id="generator-search" class="generator-search" type="search" placeholder="Find a setting" autocomplete="off"><div id="generator-pages">
<section class="generator-page" data-page="connection" aria-labelledby="connection-title"><h2 id="connection-title">Connection</h2><div class="generator-fields">
<label class="setting"><span>Server URL</span><input id="server" required placeholder="https://server.example.com" autocomplete="url" spellcheck="false"></label>
<label class="setting"><span>Shared password</span><span class="password-control"><input id="key" type="password" autocomplete="new-password" spellcheck="false" required><button id="show-key" type="button" aria-label="Show password" aria-pressed="false"></button></span></label>
<label class="setting"><span>Starting panel</span><select id="startup-panel"><option value="terminal">Terminal</option><option value="files">Files</option><option value="web-browser">Browser</option><option value="proxy-browser">Proxy browser</option><option value="task-manager">Task Manager</option><option value="docker">Docker</option><option value="start">New tab</option><option value="none">None</option></select></label>
</div></section>
<section class="generator-page" data-page="export" aria-labelledby="export-title" hidden><h2 id="export-title">Export</h2><div class="generator-fields"><label class="setting"><span>Format</span><select id="format"><option value="html">Standalone HTML</option><option value="svg">Standalone SVG</option><option value="compressed-html">Compressed HTML</option><option value="compressed-svg">Compressed SVG</option><option value="data-url">Compressed data URL</option></select></label></div></section>
</div><p id="generator-empty" class="generator-empty" hidden>No matching settings</p></main></div>
<footer class="generator-footer"><small>Contains your password. Keep the generated client private.</small><p id="error" role="alert"></p><button class="primary" type="submit"><span class="generating-spinner" hidden></span><span>Generate client</span></button></footer>
</form><script>/* GENERATOR_JS */</script></body></html>
