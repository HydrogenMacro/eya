<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eya · Generate client</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#0e151b;color:#e7f0f2}body{max-width:760px;margin:0 auto;padding:36px 20px 70px}h1{margin:0 0 4px;font-size:2rem}p{line-height:1.5;color:#b4c5ce}form{background:#18252f;border:1px solid #304653;border-radius:12px;padding:24px}label{display:block;font-weight:600;margin:20px 0 0}input,select,textarea,button{font:inherit}input:not([type=checkbox]),select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:11px;border:1px solid #526b79;border-radius:6px;background:#101b23;color:#fff}textarea{min-height:82px;resize:vertical}input[type=file]{padding:9px}small{display:block;color:#adc1ca;font-weight:400;line-height:1.4;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:550px){.grid{grid-template-columns:1fr}.launchers{grid-template-columns:1fr}}button{background:#7fdbc5;color:#10241f;border:0;border-radius:6px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:24px}#error{color:#ffb4a9;white-space:pre-wrap}.warning{border-left:3px solid #e8bf6a;padding-left:12px}a{color:#89dfcc}.launchers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.launchers a{display:block;padding:14px 16px;border:1px solid #526b79;border-radius:8px;background:#18252f;text-align:center;font-weight:700;text-decoration:none}.launchers a:hover{background:#253846}
@media(max-width:550px){.launchers{grid-template-columns:1fr}}
.data-url-result{margin-top:20px;padding:18px;border:1px solid #526b79;border-radius:8px;background:#18252f}.data-url-result[hidden]{display:none}.data-url-result textarea{min-height:130px;font:12px ui-monospace,monospace;word-break:break-all}.data-url-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.data-url-actions button,.data-url-actions a{display:inline-block;margin-top:10px;padding:9px 13px;border-radius:6px}.data-url-actions a{border:1px solid #526b79;text-decoration:none}
</style></head><body><h1>Eya</h1><p>Create a standalone terminal client for this server.</p><form id="form"><label>Server URL<input id="server" required placeholder="https://server.example.com or ws://server:8080"><small>The WebSocket endpoint is added automatically. A reverse-proxy path can be included.</small></label><label>Shared password<input id="key" type="password" autocomplete="off" spellcheck="false" required><small>Use the same non-empty EYA_KEY value as the server.</small></label><label>Default command after connecting<textarea id="command" maxlength="8192" spellcheck="false" placeholder="Optional, for example: tmux new -A -s main"></textarea><small>Runs once per new terminal session; reconnecting does not rerun it. It is embedded in the downloaded file; do not place secrets here.</small></label><label>Custom terminal font <input id="font" type="file" accept=".woff,.woff2,.ttf,.otf,font/*"><small>Optional. A monospaced WOFF2, WOFF, TTF or OTF file (up to 4 MiB) is embedded into the client.</small></label><div class="grid"><label>Font size <input id="size" type="number" min="8" max="36" value="15"></label><label>Scrollback lines <input id="scrollback" type="number" min="0" max="50000" step="100" value="5000"></label></div><div class="grid"><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><label>Cursor style<select id="cursor-style"><option value="block">Block</option><option value="underline">Underline</option><option value="bar">Bar</option></select></label></div><label>Output format<select id="format"><option value="html">Standalone HTML</option><option value="svg">Interactive standalone SVG</option></select><small>SVG embeds the complete client in a responsive SVG document. Open it directly in a browser; SVG files embedded as images cannot run interactive scripts.</small></label><label><input id="cursor-blink" type="checkbox" checked> Blinking cursor</label><label><input id="scroll-on-input" type="checkbox" checked> Return to the bottom when typing</label><p class="warning">The downloaded HTML or SVG contains your shared password and default command. Anyone who obtains it can access your terminal. Keep the file private and generate it over HTTPS or on a trusted network.</p><p id="error" role="alert"></p><button type="submit">Generate client</button></form><script>/* GENERATOR_JS */</script></body></html>
