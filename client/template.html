<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eya terminal</title>
<style>
/* XTERM_CSS */
:root{color-scheme:dark;font:15px system-ui;--eya-viewport-height:100dvh}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#e4edf2}body{position:fixed;inset:0 auto auto 0;height:var(--eya-viewport-height);display:flex;flex-direction:column}header{display:flex;flex:0 0 auto;gap:10px;align-items:center;padding:8px 12px;background:#1d2933;flex-wrap:wrap}header strong{font-size:18px}#status{flex:1;min-width:80px;color:#b8cbd1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#latency{color:#a9bdc6;font-size:13px;white-space:nowrap}button,input,select,textarea{font:inherit;border-radius:5px;border:1px solid #617481;padding:8px;background:#253541;color:white}button{cursor:pointer}button:hover{background:#385064}button:disabled{opacity:.5;cursor:default}main{flex:1;min-height:0;padding:8px}#terminal{width:100%;height:100%;touch-action:none;-webkit-touch-callout:none}.xterm{height:100%}dialog{border:1px solid #617481;border-radius:10px;background:#1d2933;color:#fff;max-width:540px;width:calc(100% - 32px);max-height:min(90vh,calc(var(--eya-viewport-height) - 24px));overflow:auto}dialog::backdrop{background:#000b}h2{margin-top:0}label{display:block;margin:14px 0}input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:5px}textarea{min-height:76px;resize:vertical}small{display:block;color:#b7c5ce;margin-top:4px}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#error{flex:0 0 auto;padding:9px 12px;background:#512e2d;color:#ffe0dc;white-space:pre-wrap}#error[hidden]{display:none}#dialog-error,#settings-error{color:#ffb6ac;white-space:pre-wrap}footer{font-size:12px;color:#adbfc8}.primary{background:#7fdbc5;color:#10241f;border-color:#7fdbc5;font-weight:700}.primary:hover{background:#9aead6}
#keybar{display:none;flex:0 0 auto;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(62px,1.5fr);gap:4px;height:calc(50px + env(safe-area-inset-bottom));padding:4px 6px calc(4px + env(safe-area-inset-bottom));overflow:hidden;background:#17232c;border-top:1px solid #415765;overscroll-behavior:none}#keybar button{min-width:0;padding:4px 2px;font-size:13px;font-weight:650;touch-action:manipulation;user-select:none;-webkit-user-select:none}#keybar button.active{background:#7fdbc5;color:#10241f;border-color:#a6efdd}#arrow-pad{position:relative;min-width:0;border:1px solid #617481;border-radius:9px;background:#253541;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}#arrow-pad:focus-visible{outline:2px solid #7fdbc5;outline-offset:-2px}.pad-arrow{position:absolute;color:#9eb2bc;font-size:10px;line-height:1}.pad-up{top:2px;left:50%;transform:translateX(-50%)}.pad-down{bottom:2px;left:50%;transform:translateX(-50%)}.pad-left{left:4px;top:50%;transform:translateY(-50%)}.pad-right{right:4px;top:50%;transform:translateY(-50%)}#arrow-stick{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#7fdbc5;box-shadow:0 1px 4px #0008;transition:transform 70ms ease}#arrow-pad[data-direction=up] #arrow-stick{transform:translateY(-12px)}#arrow-pad[data-direction=down] #arrow-stick{transform:translateY(12px)}#arrow-pad[data-direction=left] #arrow-stick{transform:translateX(-18px)}#arrow-pad[data-direction=right] #arrow-stick{transform:translateX(18px)}
#terminal-menu{position:fixed;z-index:1000;display:flex;gap:4px;padding:5px;border:1px solid #617481;border-radius:8px;background:#17232c;box-shadow:0 6px 24px #000a}#terminal-menu[hidden]{display:none}#terminal-menu button{padding:7px 9px;font-size:13px;white-space:nowrap}
@media (pointer:coarse),(max-width:760px){#keybar{display:grid}main{padding:4px}header{gap:5px;padding:5px 6px;flex-wrap:nowrap}header strong{font-size:16px}header button{padding:6px 7px;font-size:13px}.grid{grid-template-columns:1fr}dialog{width:calc(100% - 16px)}}
@media (max-width:430px){header strong{display:none}#latency{display:none}header button{padding-inline:6px}}
</style>
</head>
<body>
<header><strong>Eya</strong><span id="status" role="status">Disconnected</span><span id="latency"></span><button id="connect" class="primary">Connect</button><button id="disconnect">Disconnect</button><button id="settings">Settings</button></header>
<div id="error" role="alert" hidden></div>
<main><div id="terminal" aria-label="Terminal; long press and drag to select text"></div></main>
<nav id="keybar" aria-label="Mobile terminal keys">
  <button type="button" data-key="escape" aria-label="Escape">Esc</button>
  <button type="button" data-key="tab">Tab</button>
  <button type="button" data-key="ctrl" id="ctrl-key" aria-pressed="false">Ctrl</button>
  <button type="button" data-key="paste">Paste</button>
  <div id="arrow-pad" role="button" tabindex="0" aria-label="Arrow key pad; drag and hold in a direction to repeat" data-direction=""><span class="pad-arrow pad-up">▲</span><span class="pad-arrow pad-down">▼</span><span class="pad-arrow pad-left">◀</span><span class="pad-arrow pad-right">▶</span><span id="arrow-stick"></span></div>
</nav>
<div id="terminal-menu" role="menu" hidden><button id="copy-selection" type="button">Copy</button><button id="paste-selection" type="button">Paste</button><button id="select-all" type="button">Select all</button><button id="clear-selection" type="button">Clear</button></div>
<dialog id="connect-dialog"><h2>Connect</h2><label>WebSocket URL<input id="url" type="url" placeholder="ws://server:8080/ws" autocomplete="url"></label><label>Shared password<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Any text"></label><label>Command to run after connecting<textarea id="default-command" maxlength="8192" spellcheck="false" placeholder="Optional, for example: tmux new -A -s main"></textarea><small>Runs once after each successful connection. This is stored in the generated client, so do not put secrets here.</small></label><p id="dialog-error" role="alert"></p><div class="actions"><button id="close-connect">Close</button><button id="start-connection" class="primary">Connect</button></div></dialog>
<dialog id="settings-dialog"><h2>Terminal settings</h2><div class="grid"><label>Font size<input id="font-size" type="number" min="8" max="36"></label><label>Scrollback lines<input id="scrollback" type="number" min="0" max="50000" step="100"></label></div><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><div class="grid"><label>Cursor style<select id="cursor-style"><option value="block">Block</option><option value="underline">Underline</option><option value="bar">Bar</option></select></label><label><input id="cursor-blink" type="checkbox"> Blinking cursor</label></div><label><input id="scroll-on-input" type="checkbox"> Return to the bottom when typing</label><label><input id="local-echo" type="checkbox"> Adaptive local echo<small>On slow links, safely predictable printable keys appear in the terminal after a short, latency-based delay. Disable it before password prompts or in programs that manage their own input.</small></label><p id="settings-error" role="alert" hidden></p><div class="actions"><button id="close-settings">Close</button></div><footer>Changes apply and save immediately.</footer></dialog>
<script id="eya-config" type="application/json">{}</script><script>/* EYA_JS */</script>
</body>
</html>
