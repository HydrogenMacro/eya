<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eya terminal</title>
<style>
/* XTERM_CSS */
:root{color-scheme:dark;font:15px system-ui;--eya-viewport-height:100dvh;--panel-size:46%}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#e4edf2}body{position:fixed;inset:0 auto auto 0;height:var(--eya-viewport-height);display:flex;flex-direction:column}header{display:flex;flex:0 0 auto;gap:10px;align-items:center;padding:8px 12px;background:#1d2933;flex-wrap:wrap}header strong{font-size:18px}#status{flex:1;min-width:80px;color:#b8cbd1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#latency{color:#a9bdc6;font-size:13px;white-space:nowrap}button,input,select,textarea{font:inherit;border-radius:5px;border:1px solid #617481;padding:8px;background:#253541;color:white}input,select,textarea{font-size:16px}button{cursor:pointer}button:hover{background:#385064}button:disabled{opacity:.5;cursor:default}#workspace{position:relative;display:flex;flex:1;min-height:0;padding:8px;gap:8px}#terminal-pane{flex:1;min-width:0;min-height:0}#terminal{width:100%;height:100%;touch-action:none;-webkit-touch-callout:none}.xterm{height:100%}#file-panel{display:none;min-width:280px;min-height:220px;overflow:hidden;border:1px solid #415765;border-radius:8px;background:#131d24}body.panel-visible #file-panel{display:flex;flex-direction:column}body[data-split=vertical] #file-panel{flex:0 0 var(--panel-size)}body[data-split=horizontal] #workspace{flex-direction:column}body[data-split=horizontal] #file-panel{flex:0 0 var(--panel-size)}
#file-toolbar,#path-toolbar{display:flex;gap:5px;align-items:center;padding:6px;border-bottom:1px solid #344854}#file-toolbar button,#path-toolbar button{padding:6px 9px;min-width:36px}#file-toolbar strong{margin-right:auto;overflow:hidden;text-overflow:ellipsis}.tool-label{display:inline}.path-input{flex:1;min-width:70px;margin:0!important}.file-search{flex:1;min-width:70px;margin:0!important}.file-tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid #344854;background:#17232c;padding:4px 4px 0}.file-tab{display:flex;align-items:center;gap:4px;max-width:210px;padding:6px 9px;border-radius:5px 5px 0 0;border-bottom:0;white-space:nowrap}.file-tab.active{background:#344d5d}.file-tab-name{overflow:hidden;text-overflow:ellipsis}.tab-dirty{color:#7fdbc5}.tab-close{padding:0;border:0;background:transparent;line-height:1}.file-content{flex:1;min-height:0;position:relative}.file-view{display:none;width:100%;height:100%;overflow:auto}.file-view.active{display:block}.file-list{width:100%;border-collapse:collapse;table-layout:fixed}.file-list th{position:sticky;top:0;background:#1c2a34;text-align:left;color:#adc0ca;font-size:12px;z-index:1}.file-list th,.file-list td{padding:7px 9px;border-bottom:1px solid #263943;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-list tbody tr{cursor:pointer}.file-list tbody tr:hover,.file-list tbody tr.selected{background:#263d49}.file-list .size{width:86px;text-align:right}.file-list .modified{width:150px}.file-empty,.viewer-message{display:grid;place-items:center;height:100%;padding:24px;color:#9eb2bc;text-align:center}.viewer{height:100%;overflow:auto}.viewer img,.viewer video{display:block;max-width:100%;max-height:100%;margin:auto}.viewer video{width:100%;height:100%;background:#000}.viewer pre{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word}.editor-host{height:100%}.editor-host .cm-editor{height:100%}.editor-host .cm-scroller{overflow:auto}.file-status{min-height:28px;padding:5px 8px;border-top:1px solid #344854;color:#a9bdc6;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{border:1px solid #617481;border-radius:10px;background:#1d2933;color:#fff;max-width:620px;width:calc(100% - 32px);max-height:min(90vh,calc(var(--eya-viewport-height) - 24px));overflow:auto}dialog::backdrop{background:#000b}h2{margin-top:0}.settings-search{position:sticky;top:0;z-index:2;background:#1d2933;padding-bottom:8px}.settings-section{border-top:1px solid #40525d;padding-top:5px}.settings-section h3{margin:12px 0 0;color:#c8d9df}.settings-section[hidden],.setting[hidden]{display:none}label{display:block;margin:14px 0}input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:5px}input[type=range]{padding:0}textarea{min-height:76px;resize:vertical}small{display:block;color:#b7c5ce;margin-top:4px}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#error{flex:0 0 auto;padding:9px 12px;background:#512e2d;color:#ffe0dc;white-space:pre-wrap}#error[hidden]{display:none}#dialog-error,#settings-error{color:#ffb6ac;white-space:pre-wrap}footer{font-size:12px;color:#adbfc8}.primary{background:#7fdbc5;color:#10241f;border-color:#7fdbc5;font-weight:700}.primary:hover{background:#9aead6}
#keybar{display:none;flex:0 0 auto;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(62px,1.5fr);gap:4px;height:calc(50px + env(safe-area-inset-bottom));padding:4px 6px calc(4px + env(safe-area-inset-bottom));overflow:hidden;background:#17232c;border-top:1px solid #415765;overscroll-behavior:none}#keybar button{min-width:0;padding:4px 2px;font-size:13px;font-weight:650;touch-action:manipulation;user-select:none;-webkit-user-select:none}#keybar button.active{background:#7fdbc5;color:#10241f;border-color:#a6efdd}#arrow-pad{position:relative;min-width:0;border:1px solid #617481;border-radius:9px;background:#253541;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}#arrow-pad:focus-visible{outline:2px solid #7fdbc5;outline-offset:-2px}.pad-arrow{position:absolute;color:#9eb2bc;font-size:10px;line-height:1}.pad-up{top:2px;left:50%;transform:translateX(-50%)}.pad-down{bottom:2px;left:50%;transform:translateX(-50%)}.pad-left{left:4px;top:50%;transform:translateY(-50%)}.pad-right{right:4px;top:50%;transform:translateY(-50%)}#arrow-stick{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#7fdbc5;box-shadow:0 1px 4px #0008;transition:transform 70ms ease}#arrow-pad[data-direction=up] #arrow-stick{transform:translateY(-12px)}#arrow-pad[data-direction=down] #arrow-stick{transform:translateY(12px)}#arrow-pad[data-direction=left] #arrow-stick{transform:translateX(-18px)}#arrow-pad[data-direction=right] #arrow-stick{transform:translateX(18px)}
#terminal-menu{position:fixed;z-index:1000;display:flex;gap:4px;padding:5px;border:1px solid #617481;border-radius:8px;background:#17232c;box-shadow:0 6px 24px #000a}#terminal-menu[hidden]{display:none}#terminal-menu button{padding:7px 9px;font-size:13px;white-space:nowrap}
#path-toolbar{flex-wrap:wrap}.path-input{flex:2 1 220px}.file-search{flex:1 1 150px}.viewer{display:flex;flex-direction:column;overflow:hidden}.viewer-actions{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid #344854;flex:0 0 auto}.viewer-actions .viewer-path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aec1ca}.viewer-body{flex:1;min-height:0;overflow:auto}.viewer-body img,.viewer-body video{display:block;max-width:100%;max-height:100%;margin:auto}.viewer-body video{width:100%;height:100%;background:#000}.viewer-body pre{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word}
html,body{overscroll-behavior:none}body.connection-offline #workspace{opacity:.46;filter:grayscale(.85);transition:opacity .18s,filter .18s}.file-list .entry-actions{width:48px;padding:3px;overflow:visible;text-align:center}.file-entry-button{padding:4px 9px;min-width:34px;font-size:18px;line-height:1}.file-entry-button:hover{background:#466174}#file-entry-menu{position:fixed;z-index:1100;display:grid;min-width:140px;padding:5px;border:1px solid #617481;border-radius:8px;background:#17232c;box-shadow:0 8px 28px #000b}#file-entry-menu[hidden]{display:none}#file-entry-menu button{border:0;background:transparent;text-align:left;padding:8px 10px;white-space:nowrap}#file-entry-menu button:hover{background:#385064}#file-entry-menu button.danger{color:#ffb6ac}.viewer-body audio{display:block;width:min(640px,calc(100% - 24px));margin:24px auto}@supports(-webkit-touch-callout:none){html,body{position:fixed;inset:0;overflow:hidden}.file-view,.viewer-body,dialog,.cm-scroller{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}}
@media (pointer:coarse),(max-width:760px){#keybar{display:grid}#workspace{padding:4px}header{gap:5px;padding:5px 6px;flex-wrap:nowrap}header strong{font-size:16px}header button{padding:6px 7px;font-size:13px}.grid{grid-template-columns:1fr}dialog{width:calc(100% - 16px)}body.panel-visible #terminal-pane{display:none}body.panel-visible #file-panel{position:absolute;inset:4px;z-index:5;min-width:0;min-height:0}.file-list .modified{display:none}.tool-label{display:none}body.panel-visible #keybar{display:none}}
@media (max-width:430px){header strong{display:none}#latency{display:none}header button{padding-inline:6px}}
</style>
</head>
<body>
<header><strong>Eya</strong><span id="status" role="status">Disconnected</span><span id="latency"></span><button id="connect" class="primary">Connect</button><button id="disconnect">Disconnect</button><button id="files" aria-pressed="false">Files</button><button id="settings">Settings</button></header>
<div id="error" role="alert" hidden></div>
<main id="workspace"><section id="terminal-pane"><div id="terminal" aria-label="Terminal; long press and drag to select text"></div></section><aside id="file-panel" aria-label="File manager">
  <div id="file-toolbar"><strong>Files</strong><button id="file-back" title="Back" aria-label="Back">←</button><button id="file-forward" title="Forward" aria-label="Forward">→</button><button id="file-up" title="Parent directory" aria-label="Parent directory">↑</button><button id="file-refresh" title="Refresh" aria-label="Refresh">↻</button><button id="file-close" title="Close files" aria-label="Close files">×</button></div>
  <div id="path-toolbar"><input id="file-path" class="path-input" aria-label="Current directory" spellcheck="false"><button id="file-go">Go</button><input id="file-search" class="file-search" type="search" placeholder="Search files" aria-label="Search files"><button id="file-new-folder" title="New folder"><span class="tool-label">New </span>folder</button><button id="file-upload" title="Upload files">Upload</button><input id="file-upload-input" type="file" multiple hidden></div>
  <nav id="file-tabs" class="file-tabs" aria-label="Open files"><button class="file-tab active" data-tab="browser"><span>Browser</span></button></nav>
  <div class="file-content"><section id="browser-view" class="file-view active"><table class="file-list"><thead><tr><th>Name</th><th class="size">Size</th><th class="modified">Modified</th><th class="entry-actions" aria-label="Actions"></th></tr></thead><tbody id="file-list"></tbody></table><div id="file-empty" class="file-empty" hidden></div></section><section id="viewer-view" class="file-view"></section></div>
  <div id="file-status" class="file-status" role="status">Connect to browse files.</div>
</aside></main>
<nav id="keybar" aria-label="Mobile terminal keys">
  <button type="button" data-key="escape" aria-label="Escape">Esc</button>
  <button type="button" data-key="tab">Tab</button>
  <button type="button" data-key="ctrl" id="ctrl-key" aria-pressed="false">Ctrl</button>
  <button type="button" data-key="paste">Paste</button>
  <div id="arrow-pad" role="button" tabindex="0" aria-label="Arrow key pad; drag and hold in a direction to repeat" data-direction=""><span class="pad-arrow pad-up">▲</span><span class="pad-arrow pad-down">▼</span><span class="pad-arrow pad-left">◀</span><span class="pad-arrow pad-right">▶</span><span id="arrow-stick"></span></div>
</nav>
<div id="terminal-menu" role="menu" hidden><button id="copy-selection" type="button">Copy</button><button id="paste-selection" type="button">Paste</button><button id="select-all" type="button">Select all</button><button id="clear-selection" type="button">Clear</button></div>
<div id="file-entry-menu" role="menu" hidden><button type="button" data-file-action="open">Open</button><button type="button" data-file-action="download">Download</button><button type="button" data-file-action="rename">Rename</button><button type="button" data-file-action="delete" class="danger">Delete</button></div>
<dialog id="connect-dialog"><h2>Connect</h2><label>WebSocket URL<input id="url" type="url" placeholder="ws://server:8080/ws" autocomplete="url"></label><label>Shared password<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Any text"></label><label>Command to run after connecting<textarea id="default-command" maxlength="8192" spellcheck="false" placeholder="Optional, for example: tmux new -A -s main"></textarea><small>Runs once after each successful connection. This is stored in the generated client, so do not put secrets here.</small></label><p id="dialog-error" role="alert"></p><div class="actions"><button id="close-connect">Close</button><button id="start-connection" class="primary">Connect</button></div></dialog>
<dialog id="settings-dialog"><h2>Settings</h2><div class="settings-search"><label>Search settings<input id="settings-search" type="search" placeholder="Try “files”, “wrap”, or “cursor”"></label></div>
<section class="settings-section" data-settings><h3>Terminal</h3><div class="grid"><label class="setting">Font size<input id="font-size" type="number" min="8" max="36"></label><label class="setting">Scrollback lines<input id="scrollback" type="number" min="0" max="50000" step="100"></label></div><label class="setting">Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><div class="grid"><label class="setting">Cursor style<select id="cursor-style"><option value="block">Block</option><option value="underline">Underline</option><option value="bar">Bar</option></select></label><label class="setting"><input id="cursor-blink" type="checkbox"> Blinking cursor</label></div><label class="setting"><input id="scroll-on-input" type="checkbox"> Return to the bottom when typing</label><label class="setting"><input id="local-echo" type="checkbox"> Adaptive local echo<small>Predicts simple printable keys on slow links. Disable it before password prompts.</small></label></section>
<section class="settings-section" data-settings><h3>Files and editor</h3><label class="setting"><input id="panel-visible" type="checkbox"> Show file panel after connecting</label><div class="grid"><label class="setting">Terminal/file split<select id="split-direction"><option value="vertical">Side by side</option><option value="horizontal">Stacked</option></select></label><label class="setting">File panel size<input id="panel-size" type="range" min="25" max="75"><small><span id="panel-size-value"></span>% of the workspace</small></label></div><label class="setting">Starting directory<input id="starting-directory" spellcheck="false" placeholder="Server working directory"></label><div class="grid"><label class="setting">Automatic refresh<select id="refresh-interval"><option value="0">Off</option><option value="2">Every 2 seconds</option><option value="5">Every 5 seconds</option><option value="10">Every 10 seconds</option><option value="30">Every 30 seconds</option></select></label><label class="setting"><input id="show-hidden" type="checkbox"> Show hidden files</label></div><label class="setting"><input id="editor-wrap" type="checkbox"> Wrap long lines in the text editor</label><label class="setting"><input id="editor-line-numbers" type="checkbox"> Show editor line numbers</label><label class="setting"><input id="confirm-delete" type="checkbox"> Confirm before deleting files and folders</label></section>
<p id="settings-error" role="alert" hidden></p><div class="actions"><button id="close-settings">Close</button></div><footer>Changes apply and save immediately. Search filters settings by name and description.</footer></dialog>
<script id="eya-config" type="application/json">{}</script><script>/* EYA_JS */</script>
</body>
</html>
