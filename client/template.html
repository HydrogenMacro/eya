<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eya terminal</title><style>
/* XTERM_CSS */
:root{color-scheme:dark;font:15px system-ui}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#10151b;color:#e4edf2}body{display:flex;flex-direction:column}header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#1d2933;flex-wrap:wrap}header strong{font-size:18px}#status{flex:1;color:#b8cbd1}#latency{color:#a9bdc6;font-size:13px}button,input,select,textarea{font:inherit;border-radius:5px;border:1px solid #617481;padding:8px;background:#253541;color:white}button{cursor:pointer}button:hover{background:#385064}main{flex:1;min-height:0;padding:8px}#terminal{width:100%;height:100%}dialog{border:1px solid #617481;border-radius:10px;background:#1d2933;color:#fff;max-width:540px;width:calc(100% - 32px);max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}h2{margin-top:0}label{display:block;margin:14px 0}input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:5px}textarea{min-height:76px;resize:vertical}small{display:block;color:#b7c5ce;margin-top:4px}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#error{padding:9px 12px;background:#512e2d;color:#ffe0dc;white-space:pre-wrap}#error[hidden]{display:none}#dialog-error,#settings-error{color:#ffb6ac;white-space:pre-wrap}footer{font-size:12px;color:#adbfc8}.primary{background:#7fdbc5;color:#10241f;border-color:#7fdbc5;font-weight:700}.primary:hover{background:#9aead6}
</style></head><body><header><strong>Eya</strong><span id="status" role="status">Disconnected</span><span id="latency"></span><button id="connect" class="primary">Connect</button><button id="disconnect">Disconnect</button><button id="settings">Settings</button></header><div id="error" role="alert" hidden></div><main><div id="terminal"></div></main><dialog id="connect-dialog"><h2>Connect</h2><label>WebSocket URL<input id="url" type="url" placeholder="ws://server:8080/ws" autocomplete="url"></label><label>Shared password<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Any text"></label><label>Command to run after connecting<textarea id="default-command" maxlength="8192" spellcheck="false" placeholder="Optional, for example: tmux new -A -s main"></textarea><small>Runs once after each successful connection. This is stored in the generated client, so do not put secrets here.</small></label><p id="dialog-error" role="alert"></p><div class="actions"><button id="close-connect">Close</button><button id="start-connection" class="primary">Connect</button></div></dialog><dialog id="settings-dialog"><h2>Terminal settings</h2><div class="grid"><label>Font size<input id="font-size" type="number" min="8" max="36"></label><label>Scrollback lines<input id="scrollback" type="number" min="0" max="50000" step="100"></label></div><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><div class="grid"><label>Cursor style<select id="cursor-style"><option value="block">Block</option><option value="underline">Underline</option><option value="bar">Bar</option></select></label><label><input id="cursor-blink" type="checkbox"> Blinking cursor</label></div><label><input id="scroll-on-input" type="checkbox"> Return to the bottom when typing</label><label><input id="local-echo" type="checkbox"> Adaptive local echo<small>On slow links, safely predictable printable keys appear in the terminal after a short, latency-based delay. Disable it before password prompts or in programs that manage their own input.</small></label><p id="settings-error" role="alert" hidden></p><div class="actions"><button id="close-settings">Close</button></div><footer>Changes apply and save immediately.</footer></dialog><script id="eya-config" type="application/json">{}</script><script>/* EYA_JS */</script></body></html>
