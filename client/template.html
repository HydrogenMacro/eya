<body>
<header class="app-header"><strong>Eya</strong><span id="status" role="status">Disconnected</span><span id="latency"></span><button id="files" aria-pressed="false">Files</button><button id="connect" class="primary">Connect</button><span id="app-menu-slot"></span></header>
<div id="app-secondary" hidden><button id="disconnect">Disconnect</button><button id="settings">Settings</button></div>
<div id="error" role="alert" hidden></div>
<main id="workspace"><section id="terminal-pane"><div id="terminal" aria-label="Terminal; long press and drag to select text"></div></section><aside id="file-panel" aria-label="File manager">
  <div id="file-toolbar"><button id="file-back" title="Back" aria-label="Back">Back</button><input id="file-path" class="path-input" aria-label="Current directory" spellcheck="false"><button id="file-go" title="Go to directory">Go</button><button id="file-upload" title="Upload files">Upload</button><span id="file-menu-slot"></span><input id="file-upload-input" type="file" multiple hidden></div>
  <div id="path-toolbar"><input id="file-search" class="file-search" type="search" placeholder="Search this folder…" aria-label="Search files"></div>
  <div id="file-secondary" hidden><button id="file-forward" title="Forward">Forward</button><button id="file-up" title="Parent directory">Parent directory</button><button id="file-refresh" title="Refresh">Refresh</button><button id="file-new-folder" title="New folder">New folder</button><button id="file-close" title="Close files">Close files</button></div>
  <section id="browser-view" class="file-browser-view"><table class="file-list"><thead><tr><th>Name</th><th class="size">Size</th><th class="modified">Modified</th><th class="entry-actions" aria-label="Actions"></th></tr></thead><tbody id="file-list"></tbody></table><div id="file-empty" class="file-empty" hidden></div></section>
  <div id="file-status" class="file-status" role="status">Connect to browse files.</div>
</aside></main>
<nav id="keybar" aria-label="Mobile terminal keys">
  <button type="button" data-key="escape" aria-label="Escape">Esc</button>
  <button type="button" data-key="tab">Tab</button>
  <button type="button" data-key="ctrl" id="ctrl-key" aria-pressed="false">Ctrl</button>
  <button type="button" data-key="home">Home</button>
  <button type="button" data-key="end">End</button>
  <button type="button" data-key="page-up">PgUp</button>
  <button type="button" data-key="page-down">PgDn</button>
  <button type="button" data-key="copy">Copy</button>
  <button type="button" data-key="paste">Paste</button>
  <button type="button" data-key="interrupt">^C</button>
  <button type="button" data-key="eof">^D</button>
  <button type="button" data-key="backspace">Bksp</button>
  <button type="button" id="arrow-pad" aria-label="Arrow key; swipe in a direction, then hold to repeat" data-direction=""></button>
  <button type="button" data-key="enter">Enter</button>
</nav>
<div id="terminal-menu" role="menu" hidden><button id="copy-selection" type="button">Copy</button><button id="paste-selection" type="button">Paste</button><button id="select-all" type="button">Select all</button><button id="clear-selection" type="button">Clear</button></div>
<div id="file-entry-menu" role="menu" hidden><button type="button" data-file-action="open">Open</button><button type="button" data-file-action="download">Download</button><button type="button" data-file-action="rename">Rename</button><button type="button" data-file-action="delete" class="danger">Delete</button></div>
<dialog id="connect-dialog"><h2>Connect</h2><label>Server<input id="url" type="url" placeholder="ws://server:8080/ws" autocomplete="url"></label><label>Password<input id="key" type="password" autocomplete="off" spellcheck="false"></label><label>Startup command<textarea id="default-command" maxlength="8192" spellcheck="false" placeholder="Optional"></textarea></label><p id="dialog-error" role="alert"></p><div class="actions"><button id="close-connect">Close</button><button id="start-connection" class="primary">Connect</button></div></dialog>
<dialog id="settings-dialog"><h2>Settings</h2><div class="settings-search"><label>Search settings<input id="settings-search" type="search"></label></div>
<section class="settings-section" data-settings><h3>Appearance</h3><div class="grid"><label class="setting">Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="midnight">Midnight</option><option value="solarized">Solarized</option></select></label><label class="setting">Accent<select id="accent-color"><option value="mint">Mint</option><option value="blue">Blue</option><option value="violet">Violet</option><option value="amber">Amber</option></select></label><label class="setting">Density<select id="ui-density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label><label class="setting">UI style<select id="ui-style"><option value="default">Default</option><option value="rounded">Rounded</option><option value="square">Square</option></select></label></div><label class="setting"><input id="reduce-motion" type="checkbox"> Reduce motion</label></section>
<section class="settings-section" data-settings><h3>Terminal</h3><div class="grid"><label class="setting">Font size<input id="font-size" type="number" min="8" max="36"></label><label class="setting">Scrollback<input id="scrollback" type="number" min="0" max="50000" step="100"></label></div><label class="setting">Cursor<select id="cursor-style"><option value="block">Block</option><option value="underline">Underline</option><option value="bar">Bar</option></select></label><label class="setting"><input id="cursor-blink" type="checkbox"> Blink cursor</label><label class="setting"><input id="scroll-on-input" type="checkbox"> Scroll on input</label></section>
<section class="settings-section" data-settings><h3>Editor</h3><div class="grid"><label class="setting">Font size<input id="editor-font-size" type="number" min="12" max="28"></label><label class="setting">Tab size<select id="editor-tab-size"><option value="2">2</option><option value="4">4</option><option value="8">8</option></select></label></div><label class="setting"><input id="editor-wrap" type="checkbox"> Wrap lines</label><label class="setting"><input id="editor-line-numbers" type="checkbox"> Line numbers</label></section>
<section class="settings-section" data-settings><h3>3D viewer</h3><div class="grid"><label class="setting">Display mode<select id="cad-display-mode"><option value="shaded">Shaded</option><option value="edges">Shaded + edges</option><option value="wireframe">Wireframe</option></select></label><label class="setting">Grid planes<select id="cad-grid-planes"><option value="off">Off</option><option value="xy">XY only</option><option value="all">All three planes</option></select></label><label class="setting">Navigation<select id="cad-navigation-mode"><option value="orbit">Orbit</option><option value="firstPerson">First person</option></select></label><label class="setting">Orbit style<select id="cad-orbit-style"><option value="turntable">Turntable</option><option value="free">Free orbit</option></select></label><label class="setting">Movement speed<input id="cad-movement-speed" type="number" min="0.25" max="4" step="0.25"></label><label class="setting">Look sensitivity<input id="cad-look-speed" type="number" min="0.25" max="3" step="0.25"></label><label class="setting">Measurement color<input id="cad-measurement-color" type="color"></label><label class="setting">Measurement point size<input id="cad-measurement-point-size" type="number" min="0.5" max="3" step="0.1"></label><label class="setting">Selection color<input id="cad-selection-color" type="color"></label><label class="setting">Selection mode<select id="cad-selection-mode"><option value="part">Parts</option><option value="face">Faces</option><option value="loop">Loops</option></select></label></div><label class="setting"><input id="cad-invert-look" type="checkbox"> Invert first-person look</label><label class="setting"><input id="cad-axis-coordinates" type="checkbox"> Axis coordinates</label><label class="setting"><input id="cad-section-gizmos" type="checkbox"> Section gizmos</label><label class="setting"><input id="cad-rotation-gizmo" type="checkbox"> Rotation gizmo</label><label class="setting"><input id="cad-hover-highlights" type="checkbox"> Hover highlights</label></section>
<section class="settings-section" data-settings><h3>Files</h3><label class="setting">Starting directory<input id="starting-directory" spellcheck="false" placeholder="Server working directory"></label><label class="setting">Refresh<select id="refresh-interval"><option value="0">Off</option><option value="2">2 seconds</option><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="30">30 seconds</option></select></label><label class="setting"><input id="show-hidden" type="checkbox"> Hidden files</label><label class="setting"><input id="file-details" type="checkbox"> File details</label><label class="setting"><input id="confirm-delete" type="checkbox"> Confirm deletion</label></section>
<p id="settings-error" role="alert" hidden></p><div class="actions"><button id="close-settings">Close</button></div></dialog>
